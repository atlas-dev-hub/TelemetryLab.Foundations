# Deploy target: telemetrylab.atlas.motionapplied.com
#
# The build is two Python scripts and no dependencies — export a lap from the
# lab's own simulator, then inline it into the page. Nothing to install, nothing
# to keep up to date, and the site cannot drift from the lab because it is built
# out of it.

[build]
  base    = "site"
  publish = "dist"
  command = "python build/export_lap.py && python build/build.py"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/lap.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
