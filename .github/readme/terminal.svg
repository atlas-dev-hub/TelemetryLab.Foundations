<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
<title id="t">The lab terminal</title>
<desc id="d">lab prints the module checklist and what to do now; lab check reports that Module 01 passes.</desc>
<defs><clipPath id="c"><rect x="1" y="36" width="898" height="393"/></clipPath></defs>
<rect x="0.5" y="0.5" width="899" height="429" rx="8" fill="#131313" stroke="#272727"/>
<line x1="1" y1="36" x2="899" y2="36" stroke="#272727"/>
<g fill="#272727"><circle cx="20" cy="18" r="6"/><circle cx="40" cy="18" r="6"/><circle cx="60" cy="18" r="6"/></g>
<text x="450.0" y="23" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#A8A8A8">your-codespace</text>
<g clip-path="url(#c)"><g font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14">
<animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;0 -18;0 -36;0 -54;0 -72;0 -90;0 -108;0 -126;0 -144;0 -162" keyTimes="0.0000;0.7143;0.7465;0.7788;0.8111;0.8433;0.8756;0.9078;0.9401;1.0000" begin="0s" dur="10.85s" fill="freeze"/>
<text x="20" y="60" xml:space="preserve" opacity="0"><tspan fill="#A8A8A8">$ </tspan><tspan fill="#F4F4F4">lab</tspan><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="96" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4" font-weight="700">  ATLAS Telemetry Lab</tspan><animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="132" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4" font-weight="700">  [ ] 1. Make it yours   &lt;- you are here</tspan><animate attributeName="opacity" from="0" to="1" begin="1.10s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="150" xml:space="preserve" opacity="0"><tspan fill="#A8A8A8">  [ ] 2. Add a channel</tspan><animate attributeName="opacity" from="0" to="1" begin="1.45s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="168" xml:space="preserve" opacity="0"><tspan fill="#A8A8A8">  [ ] 3. Fix the broken producer</tspan><animate attributeName="opacity" from="0" to="1" begin="1.80s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="186" xml:space="preserve" opacity="0"><tspan fill="#A8A8A8">  [ ] 4. Write your first consumer</tspan><animate attributeName="opacity" from="0" to="1" begin="2.15s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="222" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4" font-weight="700">  What to do now</tspan><animate attributeName="opacity" from="0" to="1" begin="2.50s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="258" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4">    1. Read the instructions:  </tspan><tspan fill="#F4F4F4" font-weight="700">README.md</tspan><tspan fill="#A8A8A8">  (module 1 is at the top)</tspan><animate attributeName="opacity" from="0" to="1" begin="2.85s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="276" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4">    2. Make the change it asks for</tspan><animate attributeName="opacity" from="0" to="1" begin="3.20s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="294" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4">    3. Check your work:        </tspan><tspan fill="#F4F4F4" font-weight="700">lab check</tspan><animate attributeName="opacity" from="0" to="1" begin="3.55s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="312" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4">    4. Submit it:              </tspan><tspan fill="#F4F4F4" font-weight="700">lab submit</tspan><animate attributeName="opacity" from="0" to="1" begin="3.90s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="348" xml:space="preserve" opacity="0"><tspan fill="#A8A8A8">    Not sure why any of this works?  </tspan><tspan fill="#F4F4F4" font-weight="700">lab explain</tspan><animate attributeName="opacity" from="0" to="1" begin="4.25s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="384" xml:space="preserve" opacity="0"><tspan fill="#A8A8A8">$ </tspan><tspan fill="#F4F4F4">lab check</tspan><animate attributeName="opacity" from="0" to="1" begin="6.20s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="402" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4" font-weight="700">## Module 01 — Make it yours</tspan><animate attributeName="opacity" from="0" to="1" begin="7.75s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="420" xml:space="preserve" opacity="0"><tspan fill="#FF6600">### Passed</tspan><animate attributeName="opacity" from="0" to="1" begin="8.10s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="438" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4">The stack came up, the producer streamed a lap</tspan><animate attributeName="opacity" from="0" to="1" begin="8.45s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="456" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4">through the Stream API into Kafka, and the</tspan><animate attributeName="opacity" from="0" to="1" begin="8.80s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="474" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4">session carries your handle.</tspan><animate attributeName="opacity" from="0" to="1" begin="9.15s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="492" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4">  Session ............. Sandbourne Park</tspan><animate attributeName="opacity" from="0" to="1" begin="9.50s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="510" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4">  Messages in Kafka ... 15,700</tspan><animate attributeName="opacity" from="0" to="1" begin="9.85s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="528" xml:space="preserve" opacity="0"><tspan fill="#F4F4F4">  Configuration ....... 19</tspan><animate attributeName="opacity" from="0" to="1" begin="10.20s" dur="0.01s" fill="freeze"/></text>
<text x="20" y="546" xml:space="preserve" opacity="0"><tspan fill="#FF6600">Module 01 passes.  Submit it with: lab submit</tspan><animate attributeName="opacity" from="0" to="1" begin="10.85s" dur="0.01s" fill="freeze"/></text>
</g></g>
</svg>
