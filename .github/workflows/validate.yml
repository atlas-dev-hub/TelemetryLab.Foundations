# The bot.
#
# Runs in the LEARNER'S repository, on their compute. We host nothing. On a
# public repo GitHub Actions is free, so the whole course costs the learner
# nothing and costs us nothing.
#
# The loop: they open a PR -> this validates the module they are on -> it
# comments with what happened -> on a pass it advances the README and merges.
#
# Note on the merge commit: it is made with GITHUB_TOKEN, and GitHub
# deliberately does not let GITHUB_TOKEN-authored events trigger further
# workflow runs. That is what stops this from looping forever.

name: validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Which module is this?
        id: module
        run: |
          MODULE=$(python -c "import json;print(json.load(open('.lab/progress.json'))['module'])")
          echo "number=$MODULE" >> "$GITHUB_OUTPUT"
          echo "Validating module $MODULE for @${{ github.repository_owner }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Never silence an install. A swallowed npm error looks identical to a
      # broken validator, and costs an hour to tell apart.
      - name: Install dependencies
        run: |
          pip install -r producer/requirements.txt
          cd consumer && npm install --no-audit --no-fund

      - name: Start the telemetry stack
        run: docker compose up -d --wait kafka stream-api key-generator

      - name: Validate
        id: validate
        continue-on-error: true
        env:
          STREAM_API_ADDRESS: localhost:13579
          KEY_GENERATOR_ADDRESS: localhost:15379
          KAFKA_BOOTSTRAP: localhost:9092
        run: |
          set +e
          python .lab/validate.py "${{ steps.module.outputs.number }}" \
            --handle "${{ github.repository_owner }}" > /tmp/report.md 2>&1
          echo "outcome=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/report.md

      - name: Say what happened
        uses: actions/github-script@v7
        env:
          PASSED: ${{ steps.validate.outputs.outcome }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/report.md', 'utf8');
            const passed = process.env.PASSED === '0';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${report}\n\n<sub>[Validation run](${run})</sub>`,
            });

      - name: Stop here if it did not pass
        if: steps.validate.outputs.outcome != '0'
        run: |
          echo "::error::Module ${{ steps.module.outputs.number }} did not pass. See the pull request comment."
          exit 1

      # --- everything below runs only on a pass ---------------------------

      # The branch can legitimately be behind main before we touch it.
      #
      # The welcome workflow rewrites README.md on main within seconds of the
      # repository being created. A learner who opens their Codespace quickly
      # clones main *before* that commit lands, so their branch and main have
      # both edited README.md from different bases — and the merge at the end
      # fails with "Pull Request has merge conflicts" after the validation has
      # already passed, which is a baffling thing to be shown.
      #
      # Only the two files the bot itself rewrites can conflict here, and
      # advance.py overwrites both wholesale in the next step, so taking the
      # branch's copy loses nothing. Anything else conflicting is a real
      # conflict and we stop.
      - name: Bring the branch up to date with main
        run: |
          git config user.name  "atlas-telemetry-lab[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            exit 0
          fi
          UNMERGED=$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ')
          echo "Conflicting: $UNMERGED"
          for f in $UNMERGED; do
            case "$f" in
              README.md|.lab/progress.json) ;;
              *) echo "::error::Unexpected merge conflict in $f"; exit 1 ;;
            esac
          done
          git checkout --ours -- README.md .lab/progress.json 2>/dev/null || true
          git add README.md .lab/progress.json
          git -c core.editor=true commit --no-edit

      - name: Advance to the next module
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python .lab/advance.py "$RUN_URL"

      - name: Commit the advance
        id: advance_commit
        run: |
          git config user.name  "atlas-telemetry-lab[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .lab/progress.json
          git commit -m "Module ${{ steps.module.outputs.number }} complete" || echo "nothing to commit"
          git push origin HEAD:${{ github.head_ref }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Merge by explicit SHA, with a short retry.
      #
      # The step above just pushed a commit to this very branch, so the head SHA
      # GitHub has on the pull request is momentarily stale and a plain
      # `gh pr merge` fails with "Head branch is out of date". Naming the SHA we
      # just pushed removes the ambiguity; the retry covers the second or two
      # GitHub takes to catch up.
      - name: Merge it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.advance_commit.outputs.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api -X PUT \
                 "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/merge" \
                 -f merge_method=squash \
                 -f sha="$SHA" \
                 -f commit_title="Module ${{ steps.module.outputs.number }} complete"; then
              echo "merged on attempt $attempt"
              gh api -X DELETE \
                "repos/${{ github.repository }}/git/refs/heads/${{ github.head_ref }}" || true
              exit 0
            fi
            echo "merge attempt $attempt did not take; waiting"
            sleep 5
          done
          echo "::error::Could not merge after 5 attempts."
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
